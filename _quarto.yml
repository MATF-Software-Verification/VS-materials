format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    search: true
    number-sections: true
    number-depth: 3
    css: _styles/custom.css
  pdf:
    documentclass: book
    pdf-engine: xelatex
    toc: true
    number-sections: true
    number-depth: 3
    margin: 0.85in
    listings: true
    include-in-header:
      text: |
        \usepackage{listings}
        \usepackage{float}
        \AtBeginDocument{\lstset{breaklines=true,breakatwhitespace=false,basicstyle=\ttfamily\small}}

execute:
  enabled: false
